# M2: InLegalBERT over "prev [SEP] target [SEP] next"; context truncated first. Eff. batch 32.
seed: 42
device: cuda

model:
  name: m2_context
  kind: context
  encoder: law-ai/InLegalBERT
  max_length: 256
  num_labels: 13
  dropout: 0.1

train:
  lr: 2.0e-5
  weight_decay: 0.01
  batch_size: 8
  grad_accum_steps: 4
  epochs: 3
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  bf16: true
  num_workers: 0
  class_weighting: inv_sqrt
  early_stopping_patience: 2
  eval_batch_size: 32
  seeds: [13, 42, 1234]

data:
  processed_dir: data/processed

paths:
  models_dir: models
  runs_dir: outputs/runs
  results_dir: outputs/results
  logs_dir: outputs/logs
