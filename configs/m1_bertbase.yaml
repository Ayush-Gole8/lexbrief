# M1-ctrl: same as M1 but with general-domain bert-base-uncased.
seed: 42
device: cuda

model:
  name: m1_bertbase
  kind: sentence
  encoder: bert-base-uncased
  max_length: 128
  num_labels: 13
  dropout: 0.1

train:
  lr: 2.0e-5
  weight_decay: 0.01
  batch_size: 16
  grad_accum_steps: 2
  epochs: 4
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  bf16: true
  num_workers: 0
  class_weighting: inv_sqrt
  early_stopping_patience: 2
  eval_batch_size: 64
  seeds: [13, 42, 1234]

data:
  processed_dir: data/processed

paths:
  models_dir: models
  runs_dir: outputs/runs
  results_dir: outputs/results
  logs_dir: outputs/logs
